name: Container release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.3.1'
        type: string
        default: 'v0.3.1'
        required: true
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate version tag and source
        id: version
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import ast, os, pathlib, re, subprocess
          tag = os.environ['RELEASE_REF']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)
          tree = ast.parse(pathlib.Path('cred_broker/__init__.py').read_text())
          version = next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert tag == 'v' + version, 'tag/source version mismatch'
          assert 'cred-broker:' + version in pathlib.Path('compose.yaml').read_text()
          subprocess.run(['git','fetch','--no-tags','origin','refs/tags/'+tag+':refs/tags/'+tag], check=True)
          revision = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert revision == subprocess.check_output(['git','rev-parse',tag+'^{commit}'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('number=' + version + '\ncommit=' + revision + '\n')
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.number }}
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}
      - name: Verify exact candidate before publication
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
        run: |
          python3 -B tools/verify_release_image.py --image "$IMAGE"
          docker image inspect "$IMAGE" --format '{{.Id}}' > /tmp/cred-broker-candidate-id
      - name: Publish tested image and verify registry pull
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
        run: |
          docker push "$IMAGE"
          digest_ref=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          docker pull "$digest_ref"
          test "$(docker image inspect "$digest_ref" --format '{{.Id}}')" = "$(cat /tmp/cred-broker-candidate-id)"
          python3 -B tools/verify_release_image.py --image "$digest_ref" --project cred-broker-test-published --port 18767
          printf '%s\n' "$digest_ref" > release-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-digest
          path: release-image.txt

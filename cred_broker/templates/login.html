<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录授权中心 · cred-broker</title>
<link rel="icon" href="/static/icons/ssh.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/console.css">
</head>
<body class="login">
<main class="login-card">
  <div class="brand"><span aria-hidden="true">◇</span><div>授权中心<small>cred-broker</small></div></div>
  <h1>管理员登录</h1>
  <p>使用部署时设置的管理令牌登录。</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>管理令牌<input name="token" type="password" required autofocus autocomplete="current-password"></label>
    <button type="submit">登录</button>
  </form>
</main>
</body>
</html>
